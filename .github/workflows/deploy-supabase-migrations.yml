name: Deploy Supabase migrations

on:
  push:
    branches:
      - ops/admin-attendance-0061-0062
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Apply pending migrations 0061 through 0064 after tests pass and a production recovery point is available. Production must have exactly those four migrations pending.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start the local database without production attendance data
        shell: bash
        run: |
          set -euo pipefail
          import_migration="supabase/migrations/0035_seed_t9_attendance.sql"
          import_backup="$RUNNER_TEMP/0035_seed_t9_attendance.sql"
          legacy_migration="supabase/migrations/0044_allow_parallel_sessions_by_room.sql"
          legacy_backup="$RUNNER_TEMP/0044_allow_parallel_sessions_by_room.sql"
          restore_test_migrations() {
            if [[ -f "$import_backup" && ! -f "$import_migration" ]]; then
              mv "$import_backup" "$import_migration"
            fi
            if [[ -f "$legacy_backup" ]]; then
              mv "$legacy_backup" "$legacy_migration"
            fi
          }
          trap restore_test_migrations EXIT
          mv "$import_migration" "$import_backup"
          cp "$legacy_migration" "$legacy_backup"
          # 0044 replaces a 0039 overload after removing its parameter defaults;
          # drop that overload only in the temporary local test copy.
          python3 - "$legacy_migration" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          sql = path.read_text()
          marker = """create or replace function public.admin_update_session_occurrence(
            p_session_id uuid,
            p_scheduled_start_at timestamptz,
            p_scheduled_end_at timestamptz,
            p_cancel boolean
          )"""
          replacement = """drop function if exists public.admin_update_session_occurrence(uuid, timestamptz, timestamptz, boolean);

          """ + marker
          if sql.count(marker) != 1:
              raise SystemExit("Could not find the legacy 4-argument function definition exactly once")
          path.write_text(sql.replace(marker, replacement, 1))
          PY
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          restore_test_migrations
          trap - EXIT
      - name: Test admin attendance and timesheets
        run: supabase test db --local supabase/tests/admin_session_attendance_timesheets.test.sql
      - name: Test Admin session deletion controls
        run: supabase test db --local supabase/tests/admin_session_deletion.test.sql
      - name: Test membership start-date roster synchronization
        run: supabase test db --local supabase/tests/student_future_session_roster_sync.test.sql
      - name: Test additive month template scheduling
        run: supabase test db --local supabase/tests/month_week_template_addition.test.sql
      - name: Test eligibility access control
        run: supabase test db --local supabase/tests/session_staff_timesheet_eligibility.test.sql

  deploy:
    needs: test
    if: ${{ inputs.deploy_production }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Link production project
        run: supabase link --project-ref dtftytlyaqmxjgynicqs --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Verify only the reviewed migrations are pending
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase migration list --linked
          dry_run="$(supabase db push --linked --dry-run --skip-vault 2>&1)"
          printf '%s\n' "$dry_run"
          pending="$(printf '%s\n' "$dry_run" | grep -Eo '[0-9]{4}_[a-z0-9_]+' | sort -u || true)"
          expected=$'0061_admin_completed_session_correction\n0062_admin_session_completion_and_delete\n0063_admin_membership_start_date_sync\n0064_add_month_week_template'
          if [[ "$pending" != "$expected" ]]; then
            echo "Refusing to push: expected only migrations 0061 through 0064 to be pending." >&2
            exit 1
          fi
      - name: Verify a production recovery point exists
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          backup_state="$(supabase backups list --project-ref dtftytlyaqmxjgynicqs --output-format json)"
          pitr_enabled="$(printf '%s' "$backup_state" | jq -r '.pitr_enabled // false')"
          backup_count="$(printf '%s' "$backup_state" | jq '.backups | length')"
          if [[ "$pitr_enabled" != "true" && "$backup_count" -eq 0 ]]; then
            echo "Refusing to push: project has no listed physical backup and PITR is disabled." >&2
            exit 1
          fi
      - name: Push the reviewed migrations
        run: supabase db push --linked --yes --skip-vault
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Verify remote migration history
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Verify additive template RPCs
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          rpc_state="$(supabase db query --linked --output-format json "select to_regprocedure('public.admin_preview_month_week_template_addition(date,jsonb,text,text)') is not null as preview_rpc_exists, to_regprocedure('public.admin_add_month_week_template(date,jsonb,text,text)') is not null as apply_rpc_exists;")"
          printf '%s\n' "$rpc_state"
          preview_exists="$(printf '%s' "$rpc_state" | jq -r '.rows[0].preview_rpc_exists // false')"
          apply_exists="$(printf '%s' "$rpc_state" | jq -r '.rows[0].apply_rpc_exists // false')"
          if [[ "$preview_exists" != "true" || "$apply_exists" != "true" ]]; then
            echo "Refusing to report success: additive template RPCs are missing." >&2
            exit 1
          fi
