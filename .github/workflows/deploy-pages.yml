name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - name: Validate public build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          if [[ -z "${VITE_SUPABASE_URL:-}" ]]; then
            echo "::error title=Missing GitHub Variable::VITE_SUPABASE_URL chưa được cấu hình."
            missing=1
          fi
          if [[ -z "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error title=Missing GitHub Variable::VITE_SUPABASE_PUBLISHABLE_KEY chưa được cấu hình."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Vào Settings → Secrets and variables → Actions → Variables của repository để tạo hai biến trên."
            exit 1
          fi
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_BASE_PATH: ${{ vars.VITE_APP_BASE_PATH || '/hung-cuong-management/' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
